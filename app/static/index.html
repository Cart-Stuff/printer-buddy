<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Printer Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0B0D; --card: #17161B; --card2: #1F1E24; --line: #26242C; --track: #2A2830;
    --text: #F4F2F8; --muted: #8E8A99; --purple: #7C3AED; --lilac: #C4A7FF;
    --orange: #FF8A1F; --red: #C9372C; --red-text: #FF6B61;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 Lato, system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1500px; margin: 0 auto; padding: 24px 24px 48px; }
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 24px; font-weight: 900; }
  h1 span { color: var(--orange); }
  button { font: inherit; font-weight: 700; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 0;
           background: var(--card2); color: var(--text); cursor: pointer; }
  button.primary { background: var(--purple); color: #fff; font-weight: 900; }
  button:disabled { opacity: .55; cursor: default; }
  input { font: inherit; min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
          background: var(--bg); color: var(--text); min-width: 0; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 20px; }
  .panel h2 { font-size: 16px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .found { display: grid; gap: 8px; }
  .found label { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
                 padding: 12px; border: 1px solid var(--line); border-radius: 10px; }
  .found .key { grid-column: 2 / -1; }

  .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; }
  .card { flex: 0 1 340px; min-width: 280px; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .cam { position: relative; aspect-ratio: 4 / 3; background: var(--card2); }
  .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .nocam { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 10px; color: var(--muted); font-weight: 700; }
  .tag { position: absolute; left: 10px; top: 10px; padding: 5px 10px; border-radius: 6px; font-size: 13px; font-weight: 900;
         letter-spacing: .04em; text-transform: uppercase; background: var(--track); color: var(--text); }
  .tag.orange { background: var(--orange); color: #1A1005; }
  .tag.purple { background: var(--purple); color: #fff; }
  .tag.red { background: var(--red); color: #fff; }
  .tag.grey { color: var(--muted); }
  .iconbtn { position: absolute; right: 10px; top: 10px; width: 44px; padding: 0; display: flex; align-items: center;
             justify-content: center; background: rgba(11,11,13,.8); }
  .caption { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 14px 12px; display: flex; align-items: flex-end;
             justify-content: space-between; gap: 12px; background: linear-gradient(to top, rgba(11,11,13,.92), rgba(11,11,13,0)); }
  .caption .name { font-size: 20px; font-weight: 900; text-shadow: 0 1px 3px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caption .pct { font-size: 26px; font-weight: 900; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .bar { height: 6px; background: var(--track); }
  .bar > div { height: 100%; width: 0; transition: width .5s; }
  .status { padding: 12px 14px 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status .file { color: var(--muted); font-weight: 400; }
  .stats { margin: 0; padding: 10px 14px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .stats div { display: flex; flex-direction: column; gap: 2px; }
  .stats dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .stats dd { margin: 0; font-weight: 700; }
  .menu { position: absolute; right: 10px; top: 60px; background: var(--card2); border: 1px solid var(--line); border-radius: 10px;
          padding: 6px; display: flex; flex-direction: column; min-width: 150px; z-index: 2; }
  .menu button { background: transparent; text-align: left; }
  .menu button.danger { color: var(--red-text); }
  .card.dim .cam img, .card.dim .stats { opacity: .45; }
  .empty { text-align: center; padding: 48px 16px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
           padding: 10px 16px; border-radius: 8px; font-weight: 700; display: none; max-width: calc(100% - 32px); }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Your <span>Printers</span></h1>
    <div class="row">
      <button id="manualBtn">Add by IP</button>
      <button id="scanBtn" class="primary">Scan network</button>
    </div>
  </div>

  <section id="manual" class="panel" hidden>
    <h2>Add a printer by address</h2>
    <form id="manualForm" class="row">
      <input name="host" placeholder="192.168.1.50" required aria-label="IP address" style="flex:2 1 160px">
      <input name="port" placeholder="7125" inputmode="numeric" aria-label="Port" style="flex:1 1 80px">
      <input name="api_key" placeholder="API key (if needed)" aria-label="API key" style="flex:2 1 160px">
      <button class="primary">Add</button>
    </form>
  </section>

  <section id="results" class="panel" hidden>
    <h2 id="resultsTitle">Printers found</h2>
    <div id="found" class="found"></div>
    <div class="row" style="margin-top:12px; justify-content:flex-end">
      <button id="closeResults">Close</button>
      <button id="addSelected" class="primary">Add selected</button>
    </div>
  </section>

  <div id="grid" class="grid"></div>
  <div id="empty" class="panel empty" hidden>
    <p><strong>No printers yet.</strong></p>
    <p class="muted">Scan your network to find printers running Moonraker, then pick the ones to monitor.</p>
  </div>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const printers = new Map();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(() => t.style.display = "none", 4000);
}
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw new Error(data?.error || `HTTP ${r.status}`);
  return data;
}
const fmtTemp = t => t == null ? "—" : `${t.toFixed(0)}°`;
function fmtDur(s) {
  if (s == null) return "—";
  s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}h ${m}m` : `${m}m`;
}
function statusOf(p) {
  if (p.connection !== "online") return p.connection === "connecting" ? "connecting" : p.connection;
  if (p.klippy_state !== "ready") return p.klippy_state || "starting";
  return p.state || "standby";
}
// state -> [tag text, tag colour, bar/percent colour, status line, status colour]
const LOOK = {
  printing:   ["Printing",  "orange", "var(--orange)", "Printing",               "var(--orange)"],
  paused:     ["Paused",    "",       "var(--orange)", "Paused",                 "var(--orange)"],
  complete:   ["Done",      "purple", "var(--purple)", "Print complete",         "var(--lilac)"],
  cancelled:  ["Cancelled", "grey",   "var(--muted)",  "Print cancelled",        "var(--muted)"],
  error:      ["Error",     "red",    "var(--red)",    "Print failed",           "var(--red-text)"],
  standby:    ["Idle",      "",       "var(--orange)", "Online, ready to print", "var(--text)"],
  shutdown:   ["Error",     "red",    "var(--red)",    "Klipper shut down",      "var(--red-text)"],
  offline:    ["Offline",   "grey",   "var(--muted)",  "Can't reach printer",    "var(--muted)"],
  connecting: ["Connecting","grey",   "var(--muted)",  "Connecting…",            "var(--muted)"],
  auth_error: ["Offline",   "grey",   "var(--muted)",  "Needs a valid API key",  "var(--red-text)"],
};
const look = st => LOOK[st] || [st, "grey", "var(--muted)", `Klipper ${st}`, "var(--muted)"];
const NOCAM_SVG = `<svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5.1A15 15 0 0 1 22 8.8M5 12.5a10 10 0 0 1 3.3-2M15.5 10.7A10 10 0 0 1 19 12.5M8.5 16a5 5 0 0 1 7 0M12 20h.01M3 3l18 18"/></svg>`;
const MENU_SVG = `<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>`;

// ---- dashboard ---------------------------------------------------------------
function render() {
  const grid = $("#grid");
  $("#empty").hidden = printers.size > 0;
  for (const el of [...grid.children]) if (!printers.has(+el.dataset.id)) el.remove();
  for (const p of printers.values()) {
    let el = grid.querySelector(`[data-id="${p.id}"]`);
    if (!el) {
      el = document.createElement("article");
      el.className = "card"; el.dataset.id = p.id;
      el.innerHTML = `<div class="cam"><img alt="" hidden><div class="nocam">${NOCAM_SVG}<span></span></div>
          <span class="tag"></span>
          <button class="iconbtn" aria-label="Printer settings" aria-expanded="false">${MENU_SVG}</button>
          <div class="caption"><span class="name"></span><span class="pct"></span></div></div>
        <div class="bar"><div></div></div>
        <div class="status"></div>
        <dl class="stats"><div><dt>Time left</dt><dd data-f="left"></dd></div>
          <div><dt>Nozzle</dt><dd data-f="nozzle"></dd></div><div><dt>Bed</dt><dd data-f="bed"></dd></div></dl>
        <div class="menu" hidden><button data-act="rename">Rename</button><button data-act="remove" class="danger">Remove</button></div>`;
      const menu = el.querySelector(".menu"), mbtn = el.querySelector(".iconbtn");
      mbtn.onclick = () => { menu.hidden = !menu.hidden; mbtn.setAttribute("aria-expanded", String(!menu.hidden)); };
      el.querySelector("[data-act=rename]").onclick = () => { menu.hidden = true; rename(p.id); };
      el.querySelector("[data-act=remove]").onclick = () => { menu.hidden = true; removePrinter(p.id); };
      grid.append(el);
    }
    const st = statusOf(p);
    const [tagText, tagColor, barColor, statusText, statusColor] = look(st);
    const active = p.state === "printing" || p.state === "paused";
    const showPct = active || p.state === "complete";
    const pct = showPct ? p.progress : 0;
    el.classList.toggle("dim", p.connection !== "online" || p.klippy_state !== "ready");

    const tag = el.querySelector(".tag");
    tag.textContent = tagText; tag.className = `tag ${tagColor}`; tag.title = p.error || "";
    el.querySelector(".name").textContent = p.name;
    const pctEl = el.querySelector(".pct");
    pctEl.textContent = showPct ? `${Math.floor(pct * 100)}%` : "";
    pctEl.style.color = p.state === "complete" ? "var(--lilac)" : "#fff";
    const bar = el.querySelector(".bar > div");
    bar.style.width = `${pct * 100}%`; bar.style.background = barColor;

    const status = el.querySelector(".status");
    const detail = (p.state === "error" && p.message) || null;
    status.innerHTML = `<span style="color:${statusColor}">${esc(detail || statusText)}</span>` +
      (p.filename && (active || p.state === "complete") ? ` <span class="file">· ${esc(p.filename)}</span>` : "");
    status.title = [detail || statusText, p.filename].filter(Boolean).join(" · ");

    const live = p.connection === "online";
    el.querySelector('[data-f="left"]').textContent = active ? fmtDur(p.eta) : "—";
    el.querySelector('[data-f="nozzle"]').textContent = live ? fmtTemp(p.nozzle) : "—";
    el.querySelector('[data-f="bed"]').textContent = live ? fmtTemp(p.bed) : "—";

    const img = el.querySelector(".cam img"), nocam = el.querySelector(".nocam");
    const camOk = p.has_webcam && live;
    img.hidden = !camOk;
    nocam.hidden = camOk;
    nocam.querySelector("span").textContent = !live ? "Can't reach printer" : "No camera";
    if (p.has_webcam && !img.src) img.src = `/api/printers/${p.id}/snapshot?t=${Date.now()}`;
  }
}
setInterval(() => {   // refresh webcam snapshots
  if (document.hidden) return;
  for (const img of document.querySelectorAll(".card .cam img:not([hidden])"))
    img.src = `/api/printers/${img.closest(".card").dataset.id}/snapshot?t=${Date.now()}`;
}, 5000);

async function rename(id) {
  const p = printers.get(id); const name = prompt("Printer name", p.name);
  if (!name || name === p.name) return;
  try { printers.set(id, await api(`/api/printers/${id}`, { method: "PATCH", body: JSON.stringify({ name }) })); render(); }
  catch (e) { toast(e.message); }
}
async function removePrinter(id) {
  if (!confirm(`Stop monitoring ${printers.get(id).name}?`)) return;
  try { await api(`/api/printers/${id}`, { method: "DELETE" }); printers.delete(id); render(); }
  catch (e) { toast(e.message); }
}

// ---- live updates --------------------------------------------------------------
function connectEvents() {
  const es = new EventSource("/api/events");
  es.addEventListener("snapshot", e => { printers.clear(); for (const p of JSON.parse(e.data)) printers.set(p.id, p); render(); });
  es.addEventListener("printer", e => { const p = JSON.parse(e.data); printers.set(p.id, p); render(); });
  es.addEventListener("removed", e => { printers.delete(JSON.parse(e.data).id); render(); });
  es.addEventListener("event", e => { const d = JSON.parse(e.data); toast(`${d.name}: print ${d.event}`); });
}

// ---- scan → pick ---------------------------------------------------------------
$("#scanBtn").onclick = async () => {
  const btn = $("#scanBtn"); btn.disabled = true; btn.textContent = "Scanning…";
  try { showResults((await api("/api/scan", { method: "POST" })).printers); }
  catch (e) { toast(e.message); }
  finally { btn.disabled = false; btn.textContent = "Scan network"; }
};
function showResults(list) {
  $("#results").hidden = false;
  $("#resultsTitle").textContent = list.length ? `Printers found (${list.length}) — pick the ones to monitor` : "No printers found";
  $("#found").innerHTML = list.length ? list.map((p, i) => `
    <label>
      <input type="checkbox" data-i="${i}" ${p.added_id ? "disabled checked" : ""}>
      <span><strong>${esc(p.name)}</strong> <span class="muted">${esc(p.host)}:${p.port}</span><br>
        <span class="muted">${[p.klipper_version && "Klipper " + p.klipper_version, p.moonraker_version && "Moonraker " + p.moonraker_version,
          p.has_webcam && "webcam", p.klippy_state && p.klippy_state !== "ready" && "klippy " + p.klippy_state].filter(Boolean).map(esc).join(" · ")}</span></span>
      <span class="muted">${p.added_id ? "already added" : p.needs_auth ? "needs API key" : ""}</span>
      ${p.needs_auth && !p.added_id ? `<input class="key" data-key="${i}" placeholder="Moonraker API key">` : ""}
    </label>`).join("")
    : `<p class="muted">Nothing answered on ports ${"7125/80"}. If Moonraker's [zeroconf] is off or the printer is on another subnet, use “Add by IP”.</p>`;
  $("#found")._list = list;
  $("#addSelected").hidden = !list.some(p => !p.added_id);
}
$("#closeResults").onclick = () => $("#results").hidden = true;
$("#addSelected").onclick = async () => {
  const list = $("#found")._list || [];
  const picks = [...document.querySelectorAll("#found input[type=checkbox]:checked:not(:disabled)")].map(c => +c.dataset.i);
  if (!picks.length) return toast("Pick at least one printer");
  let added = 0;
  for (const i of picks) {
    const p = list[i]; const key = document.querySelector(`[data-key="${i}"]`)?.value.trim();
    try {
      const v = await api("/api/printers", { method: "POST", body: JSON.stringify({ host: p.host, port: p.port, name: p.name, api_key: key }) });
      printers.set(v.id, v); p.added_id = v.id; added++;
    } catch (e) { toast(`${p.name}: ${e.message}`); }
  }
  render(); showResults(list);
  if (added) toast(`Added ${added} printer${added > 1 ? "s" : ""}`);
};

// ---- manual add -------------------------------------------------------------------
$("#manualBtn").onclick = () => $("#manual").hidden = !$("#manual").hidden;
$("#manualForm").onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  try {
    const v = await api("/api/printers", { method: "POST", body: JSON.stringify({ host: f.host.trim(), port: f.port || 7125, api_key: f.api_key }) });
    printers.set(v.id, v); render(); e.target.reset(); $("#manual").hidden = true; toast(`Added ${v.name}`);
  } catch (err) { toast(err.message); }
};

connectEvents();
render();
</script>
</body>
</html>
