services:
  printer-monitor:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # host networking so the LAN sweep and mDNS see your real network
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../data:/data
    environment:
      # - PORT=8081                         # default 8080; change if something else uses it
      # - SCAN_SUBNETS=192.168.1.0/24        # default: the /24 this box is on
      # - NTFY_URL=https://ntfy.sh/my-printers
      # - DISCORD_WEBHOOK=https://discord.com/api/webhooks/...
      # - NOTIFY_EVENTS=started,paused,resumed,finished,failed,cancelled
      - LOG_LEVEL=INFO
