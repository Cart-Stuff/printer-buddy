# Cloudflare deploys this Worker straight from GitHub on every push (Workers Builds).
# Connect once: Workers & Pages > printer-buddy-share > Settings > Builds > Connect
#   repository: printer-buddy, branch: main, root directory: relay
#   build command: (empty)   deploy command: npx wrangler deploy (the default)
# The name below must match the Worker's name in the dashboard.

name = "printer-buddy-share"
main = "worker.js"
compatibility_date = "2025-09-01"

# Keep the variables set in the dashboard (CF_ACCOUNT_ID, CF_ZONE_ID, SHARE_DOMAIN, DATA_REPO, ...).
# Secrets (CF_API_TOKEN, GITHUB_TOKEN, DISCORD_WEBHOOK) are never changed by a deploy.
keep_vars = true

routes = [
  { pattern = "www.printerbuddy.stream/*", zone_name = "printerbuddy.stream" },
]

# storage for tunnels, photo limits and AI stats ("printer-buddy-boxes")
kv_namespaces = [
  { binding = "BOXES", id = "bf28f11d28de4b8c983948066e4b038e" },
]

# daily AI report to Discord at 13:00 UTC
[triggers]
crons = ["0 13 * * *"]
